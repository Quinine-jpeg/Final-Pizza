{% extends layout.html %}
{% block content %}

<form id="order_pizzas" action="/" method="post">
<input type="hidden" name="csrf_token" value="{{csrf_token()}}">

<table>
  {% for pizza in content %}
  <tr id="{{% pizza[1] %}}-short" >
    <td class="pname">{% pizza[1] %}</td>
    <td class="descrip" onclick="expand">{% pizza[3] %}</td>
    <td class="qty">
      <p>Qty:</p>
      <button id="{{% pizza[1] %}}+" class="-" onclick="minusQty">-</button>
      <input id="{{% pizza[0] %}}-amount-short" value="0" name="{{% pizza[0] %}}" type="number" class="qtynum" readonly>
      <button id="{{% pizza[1] %}}-" class="+" onclick="addQty">+</button>
    </td>
    <td class="price">{% pizza[2] %}</td>
  </tr>

  <tr id="{{% pizza[1] %}}-long" class="hidden">
    <td class="pizza-img"><img src="{{ url_for('static', filename='assets/{% pizza[0] %}.png') }}"></td>
    <td class="pname">{% pizza[1] %}</td>
    <td class="descrip" onclick="expand">{% pizza[3] %}</td>
    <td class="qty">
      <p>Qty:</p>
      <button id="{{% pizza[1] %}}+" class="-" onclick="minusQty">-</button>
      <p id="{{% pizza[1] %}}-amount-long" value="0" name="{{% pizza[1] %}}" type="number" class="qtynum" readonly></p>
      <button id="{{% pizza[1] %}}-" class="+" onclick="addQty">+</button>
    </td>
    <td class="price">{% pizza[2] %}</td>
  </tr>
  {% endfor %}
</table>

<div style="align-items: left;"><p>Total items in cart:</p><p id="numitems">0</p></div>
<div style="align-items: center"><a><button type="submit">Proceed to checkout</button></a></div>
<div style="align-items: right"><p>Total price:</p><p id="totprice">0</p></div>

</form>

<script>
  function addQty(evt) {
    evt.target.parentElement.getElementByClassName('qtynum').value += 1;
    numitems.textContent = parseInt(numitems.textContent) + 1;
    totprice.textContent = parseInt(evt.target.parentElement.getElementByClassName('price').textContent) + parseInt(totprice.textContent);
  }

  function minusQty(evt) {
    evt.target.parentElement.getElementByClassName('qtynum').value -= 1;
    numitems.textContent = parseInt(numitems.textContent) - 1;
    totprice.textContent = parseInt(evt.target.parentElement.getElementByClassName('price').textContent) + parseInt(totprice.textContent);
  }

function expand(evt) {
  event.target.parentElement.parentElement.querySelectorAll('tr').forEach(element => {
    element.classList.toggle('hidden');
  }); //spaghetti code
}
</script>
