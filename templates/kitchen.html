<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta http-equiv="Content-Security-Policy" content="script-src 'self';" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"  />
  <title>Kitchen disp</title>
  <link rel="manifest" href="{{ url_for('static', filename='assets/manifest.json') }}" />
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/logo.png') }}" />
</head>
<body>
  {% block content %}
  <table>
    {% for row in content %}
    <tr>
      <td>{% row[0] %}</td> <!-- order id -->
      {% for pizza in row[1] %} <!-- pizzas (by name) -->
      <td>
        <input type="checkbox" id="{% pizza %}">
        <label for="{% pizza %}">{% pizza %}</label>
      </td>
    </tr>
  </table>
</body>
