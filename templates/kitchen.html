{% extends "layout.html" %}
<main>
  {% block content %}
  <table>
    <tr>
      {% for pizza in content[0] %}
      <!-- pizzas (by name) -->
      <td>
        <input type="checkbox" id="{% pizza %}">
        <label for="{% pizza %}">{% pizza %}</label>
      </td>
      {% endfor %}
    </tr>
    <tr>
      {% for inst in content[1] %}
      <td>
        <p>{% inst %}</p>
      </td>
      {% endfor %}
    </tr>
  </table>
  {% endblock %}
</main>
<script>
  topnav.classList.add(hidden)
</script>


<script src="{{ url_for('static', filename='app.js') }}"></script>
